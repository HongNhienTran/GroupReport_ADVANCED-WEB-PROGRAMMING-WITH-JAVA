server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: the-sweet-lab-be
  
  # PostgreSQL Datasource
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/the_sweet_lab_db}
    username: ${SPRING_DATASOURCE_USERNAME:sweetlab_user}
    password: ${SPRING_DATASOURCE_PASSWORD:sweetlab_password}
    driver-class-name: org.postgresql.Driver

  # JPA & Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # Redis
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}

  # Mail Server (Mailpit by default for local testing)
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  # Thymeleaf Template Engine
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8

# JWT & Security Configuration
app:
  jwt:
    # 256-bit secret key in base64 or plaintext
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    access-token-expiration-ms: 86400000    # 24 hours (1 day)
    refresh-token-expiration-ms: 604800000  # 7 days
  mail:
    from: "The Sweet Lab <no-reply@thesweetlab.com>"
    verification-url: "http://localhost:3000/verify-email"
    verification-token-expiration-minutes: 15
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://127.0.0.1:3000"

# Springdoc OpenAPI (Swagger 3)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
